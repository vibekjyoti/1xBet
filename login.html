<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1xBet - Log In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b1520; --bg-panel: #112030; --bg-card: #172b40;
            --text-main: #ffffff; --text-muted: #8d9ba8;
            --accent-blue: #238cf5; --accent-blue-hover: #1a7ae0;
            --border-color: #1a3148;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body {
            background: linear-gradient(135deg, var(--bg-base) 0%, #060b11 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background: var(--bg-panel);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .logo-header { text-align: center; margin-bottom: 30px; cursor: pointer; }
        .logo { font-size: 28px; font-weight: 900; font-style: italic; letter-spacing: -0.5px; }
        .logo span { color: var(--accent-blue); }

        .auth-title { font-size: 18px; font-weight: 700; margin-bottom: 25px; text-align: center; text-transform: uppercase; letter-spacing: 1px; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; font-weight: 600; }
        .input-group input { 
            width: 100%; padding: 14px; background: var(--bg-card); 
            border: 1px solid var(--border-color); color: white; 
            border-radius: 6px; font-size: 14px; outline: none; transition: 0.2s;
        }
        .input-group input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(35, 140, 245, 0.1); }

        .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; font-size: 12px; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; color: var(--text-muted); cursor: pointer; }
        .forgot-link { color: var(--accent-blue); text-decoration: none; font-weight: 500; }
        .forgot-link:hover { text-decoration: underline; }

        .btn-submit { 
            width: 100%; padding: 15px; background: var(--accent-blue); 
            color: white; font-size: 14px; font-weight: 700; border: none; 
            border-radius: 6px; cursor: pointer; text-transform: uppercase; transition: 0.2s;
        }
        .btn-submit:hover { background: var(--accent-blue-hover); transform: translateY(-1px); }

        .auth-footer { margin-top: 25px; text-align: center; font-size: 12px; color: var(--text-muted); }
        .auth-footer a { color: var(--text-main); font-weight: 600; text-decoration: none; margin-left: 5px; }
        .auth-footer a:hover { color: var(--accent-blue); }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo-header" onclick="window.location.href='index.html'">
            <div class="logo">1X<span>BET</span></div>
        </div>
        
        <div class="auth-title">Log in to your account</div>

        <form id="loginForm">
            <div class="input-group">
                <label>Email or ID</label>
                <input type="text" id="userId" placeholder="Enter your email or ID" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="userPwd" placeholder="••••••••" required>
            </div>

            <div class="form-options">
                <label class="checkbox-group">
                    <input type="checkbox" checked> Remember me
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="btn-submit">Log In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="signup.html">Register Now</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Simulate backend authentication delay
            const btn = document.querySelector('.btn-submit');
            btn.innerHTML = 'Authenticating...';
            btn.style.opacity = '0.8';
            
            setTimeout(() => {
                alert("Login Successful! Welcome back.");
                window.location.href = 'index.html';
            }, 800);
        });
    </script>
</body>
</html>
