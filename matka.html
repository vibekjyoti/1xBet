<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1xBet - Matka Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b1520; --bg-panel: #112030; --bg-card: #172b40;
            --text-main: #ffffff; --text-muted: #8d9ba8;
            --accent-blue: #238cf5; --accent-yellow: #ffc107; --accent-green: #5c9e28;
            --border-color: #1a3148;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
        
        header { background: var(--bg-header); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 22px; font-weight: 900; font-style: italic; cursor: pointer; }
        .logo span { color: var(--accent-blue); }
        .header-right { display: flex; gap: 15px; align-items: center; }
        .wallet { background: var(--bg-card); padding: 8px 15px; border-radius: 4px; font-weight: bold; border: 1px solid var(--accent-blue); }
        .close-btn { background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted); padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        
        .layout { display: flex; flex-direction: column; align-items: center; padding: 40px 20px; flex: 1; }
        
        /* Draw Screen */
        .draw-screen { background: radial-gradient(circle, #1e3650 0%, #112030 100%); width: 100%; max-width: 600px; height: 200px; border-radius: 12px; border: 2px solid var(--accent-yellow); margin-bottom: 30px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .draw-title { font-size: 14px; color: var(--accent-yellow); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; font-weight: bold; }
        .drawn-number { font-size: 80px; font-weight: 900; line-height: 1; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        /* Betting Board */
        .board { background: var(--bg-panel); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); max-width: 600px; width: 100%; margin-bottom: 20px; }
        .board-title { text-align: center; margin-bottom: 15px; font-weight: bold; color: var(--text-muted); }
        .numbers-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        
        .num-btn { background: var(--bg-card); border: 2px solid var(--border-color); color: white; padding: 20px; font-size: 24px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .num-btn:hover { background: var(--bg-hover); border-color: var(--accent-blue); }
        .num-btn.selected { background: var(--accent-blue); border-color: white; transform: scale(1.05); }

        /* Controls */
        .controls { display: flex; gap: 15px; width: 100%; max-width: 600px; }
        .input-group { flex: 1; }
        .input-group input { width: 100%; background: var(--bg-panel); border: 1px solid var(--border-color); color: white; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 4px; outline: none; }
        
        .btn-play { flex: 1; background: var(--accent-green); color: white; font-size: 20px; font-weight: 900; border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
        .btn-play:disabled { background: #333; color: #666; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="window.location.href='index.html'">1X<span>BET</span></div>
        <div class="header-right">
            <div class="wallet">₹ <span id="balance">10000.00</span></div>
            <button class="close-btn" onclick="window.location.href='index.html'">HUB</button>
        </div>
    </header>

    <div class="layout">
        <div class="draw-screen">
            <div class="draw-title">SINGLE DIGIT DRAW (9x PAYOUT)</div>
            <div class="drawn-number" id="resultDisplay">?</div>
        </div>

        <div class="board">
            <div class="board-title">SELECT YOUR NUMBER</div>
            <div class="numbers-grid" id="numberGrid">
                <!-- Numbers 0-9 generated by JS -->
            </div>
        </div>

        <div class="controls">
            <div class="input-group">
                <input type="number" id="betAmount" value="100" min="10" placeholder="Bet Amount (₹)">
            </div>
            <button class="btn-play" id="btnPlay" onclick="playMatka()">PLACE BET</button>
        </div>
    </div>

    <script>
        const grid = document.getElementById('numberGrid');
        const balanceDisplay = document.getElementById('balance');
        const resultDisplay = document.getElementById('resultDisplay');
        const btnPlay = document.getElementById('btnPlay');
        
        let balance = 10000.00;
        let selectedNumber = null;
        let isDrawing = false;

        // Generate betting buttons 0-9
        for (let i = 0; i <= 9; i++) {
            const btn = document.createElement('button');
            btn.className = 'num-btn';
            btn.innerText = i;
            btn.onclick = () => selectNumber(i, btn);
            grid.appendChild(btn);
        }

        function selectNumber(num, btnElement) {
            if (isDrawing) return;
            
            document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('selected'));
            btnElement.classList.add('selected');
            selectedNumber = num;
        }

        function playMatka() {
            if (selectedNumber === null) return alert('Please select a number first!');
            
            const betAmount = parseFloat(document.getElementById('betAmount').value);
            if (betAmount > balance) return alert('Insufficient Balance!');

            // Deduct Bet
            balance -= betAmount;
            balanceDisplay.innerText = balance.toFixed(2);
            
            isDrawing = true;
            btnPlay.disabled = true;
            btnPlay.innerText = 'DRAWING...';
            
            // Rolling animation
            let rollInterval = setInterval(() => {
                resultDisplay.innerText = Math.floor(Math.random() * 10);
            }, 50);

            // Final Result after 2.5 seconds
            setTimeout(() => {
                clearInterval(rollInterval);
                const winningNumber = Math.floor(Math.random() * 10);
                resultDisplay.innerText = winningNumber;

                if (winningNumber === selectedNumber) {
                    const winnings = betAmount * 9; // 9x payout for single digit
                    balance += winnings;
                    balanceDisplay.innerText = balance.toFixed(2);
                    resultDisplay.style.color = 'var(--accent-green)';
                    alert(`Congratulations! You won ₹${winnings.toFixed(2)}`);
                } else {
                    resultDisplay.style.color = 'var(--accent-red)';
                }

                // Reset state
                setTimeout(() => {
                    isDrawing = false;
                    btnPlay.disabled = false;
                    btnPlay.innerText = 'PLACE BET';
                    resultDisplay.style.color = 'var(--text-main)';
                    resultDisplay.innerText = '?';
                    document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('selected'));
                    selectedNumber = null;
                }, 2500);

            }, 2500);
        }
    </script>
</body>
</html>
